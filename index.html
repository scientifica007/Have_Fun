<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Elsewhere — Atlas of Impossible Worlds</title>
<style>
:root{--bg:#090c17;--panel:#12192a;--ink:#eaf3f4;--muted:#a0aec5;--accent:#9ee8d8;--line:#29364e}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 55% 0,#192a42,var(--bg) 65%);color:var(--ink);font:15px/1.55 system-ui,sans-serif;min-height:100vh}main{max-width:1100px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}h1,h2,p{margin:0}h1{font-size:clamp(27px,5vw,46px);font-weight:400;letter-spacing:.13em}h2{font-size:clamp(22px,4vw,32px);font-weight:500;line-height:1.2}.eyebrow{font-size:11px;letter-spacing:.19em;color:var(--accent);text-transform:uppercase}.muted{color:var(--muted)}.layout{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px}.panel{background:rgba(18,25,42,.9);border:1px solid var(--line);border-radius:18px;padding:18px}.scene{padding:0;overflow:hidden;position:relative;min-width:0}canvas{display:block;width:100%;height:auto;touch-action:manipulation}.scene .overlay{position:absolute;top:15px;left:18px;pointer-events:none}.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}button,input{font:inherit}button{background:#202e43;border:1px solid #455873;color:var(--ink);padding:10px 13px;border-radius:9px;cursor:pointer;min-height:44px}button:hover,button:focus-visible{border-color:var(--accent)}button.primary{background:var(--accent);color:#09251f;border-color:var(--accent);font-weight:650}button:disabled{opacity:.48;cursor:default}.story{margin:14px 0;color:#d0dcec;min-height:72px}.stat{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}.stat span:first-child{color:var(--muted)}.signal{margin-top:18px;padding:14px;background:#0b1120;border:1px solid var(--line);border-radius:12px}.meter{height:5px;background:#29364e;border-radius:5px;overflow:hidden;margin:10px 0}.meter i{display:block;height:100%;background:var(--accent);transition:width .2s}.journal{margin-top:16px}.entries{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px;margin-top:12px}.entry{border:1px solid var(--line);padding:12px;border-radius:9px;background:#0b1120}.entry strong{color:var(--accent);display:block}.entry small{color:var(--muted)}footer{margin-top:18px;font-size:12px;color:var(--muted)}[dir=rtl] h1{letter-spacing:0}[dir=rtl] .scene .overlay{left:auto;right:18px}button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}@media(max-width:740px){main{padding:12px}.layout{grid-template-columns:1fr}.panel{padding:14px}.scene{padding:0}.story{min-height:0}}
</style>
</head>
<body><main>
<header><div><div class="eyebrow" id="subtitle">An expedition beyond reality</div><h1 id="brand">ELSEWHERE.</h1></div><button id="lang" aria-label="Switch language">العربية</button></header>
<div class="layout"><section><div class="panel scene"><canvas id="sky" width="720" height="500" aria-label="Procedurally generated imaginary planet"></canvas><div class="overlay"><div class="eyebrow" id="sector"></div><div class="muted" id="coordinates"></div></div></div><div class="controls"><button id="prev">←</button><button class="primary" id="jump">Jump to another world</button><button id="next">→</button><button id="postcard">Save postcard</button></div></section>
<section class="panel"><div class="eyebrow" id="catalog"></div><h2 id="world"></h2><p class="story" id="story"></p><div id="stats"></div><div class="signal"><div class="eyebrow" id="signalTitle">An unknown signal</div><p id="hint" class="muted"></p><div class="meter" role="progressbar" aria-label="Signal strength" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="meter"><i id="strength" style="width:0%"></i></div><div class="controls" id="bands"></div><p id="result" aria-live="polite" style="margin-top:10px"></p></div></section></div>
<section class="panel journal"><div class="eyebrow" id="logTitle">Expedition journal</div><h2 id="count"></h2><div id="entries" class="entries"></div><div class="controls"><button id="export">Export journal</button></div></section>
<div class="controls"><a href="archipelago.html" style="color:#9ee8d8">Experiment 002 — أرخبيل الريح / Wind Archipelago</a></div><footer id="foot">A fictional universe. No accounts, no network requests, no real astronomical claims. Your discoveries stay in this browser.</footer>
</main>
<script>
'use strict';
const $=id=>document.getElementById(id), C=$('sky'), ctx=C.getContext('2d');
const worlds=[
['Vesper','فيسبر','A world where shadows arrive before the objects that cast them. The inhabitants navigate by waiting for tomorrow’s darkness.','عالم تصل فيه الظلال قبل الأشياء التي تصنعها. يهتدي سكانه بانتظار ظلام الغد.','Anticipatory shadows','ظلال استباقية','Glass rain','مطر زجاجي','A shadow of a vanished tower','ظل برج اختفى',194,0],
['Nacre','ناكْر','The ocean floats above the land. At low tide, mountains briefly see the sky.','يطفو المحيط فوق اليابسة. وعند الجزر ترى الجبال السماء للحظات.','Inverted oceans','محيطات مقلوبة','Pearl clouds','سحب لؤلؤية','A tide trapped in a shell','مدّ محبوس في صدفة',164,1],
['Morrow','مورو','Every valley has a different tomorrow. Maps are printed with dates instead of distances.','لكل وادٍ غد مختلف. تُطبع الخرائط بالتواريخ بدل المسافات.','Local futures','مستقبل محلي','Amber fog','ضباب كهرماني','A map of a day that never came','خريطة يوم لم يأتِ',38,0],
['Orrery','أوريري','The planet is surrounded by rings made of abandoned ideas, visible only when no one is thinking about them.','تحيط بالكوكب حلقات من أفكار مهجورة، لا تُرى إلا حين لا يفكر فيها أحد.','Visible forgotten ideas','أفكار منسية مرئية','Violet dust','غبار بنفسجي','An unasked question','سؤال لم يُطرح',268,1],
['Hush','هَش','Sound grows in forests like fruit. A single ripe note can be heard for a hundred years.','ينمو الصوت في الغابات كالثمار. ويمكن سماع نغمة ناضجة لمئة سنة.','Growing sound','صوت ينمو','Silent storms','عواصف صامتة','A seed of silence','بذرة صمت',115,0],
['Palindrome','باليندروم','Rivers remember their sources and return to them each evening, carrying the sunset upstream.','تتذكر الأنهار منابعها وتعود إليها كل مساء، حاملة الغروب عكس التيار.','Reversing rivers','أنهار عكسية','Copper dawn','فجر نحاسي','A river’s first drop','أول قطرة لنهر',15,0],
['Lumen','لومن','Light is heavy here. Old buildings sink under centuries of accumulated sunshine.','للضوء وزن هنا. تغرق المباني القديمة تحت شمس تراكمت قرونًا.','Massive light','ضوء ثقيل','Golden snow','ثلج ذهبي','A gram of morning','غرام من الصباح',55,1],
['Thimble','ثيمبل','An entire civilization lives inside the hollow of a mountain-sized needle. Outside, the plains are perfectly empty.','تعيش حضارة كاملة داخل تجويف إبرة بحجم جبل. وخارجها سهول خالية تمامًا.','Interior civilizations','حضارات داخلية','Silver wind','رياح فضية','A miniature horizon','أفق مصغّر',222,0],
['Mnemos','نيموس','Crystals keep memories of events that never happened. No two visitors remember the same planet.','تحتفظ البلورات بذكريات أحداث لم تقع. ولا يتذكر زائران الكوكب بالطريقة نفسها.','Counterfactual memory','ذاكرة أحداث لم تقع','Rose lightning','برق وردي','A memory belonging to nobody','ذكرى لا تخص أحدًا',322,1],
['Interlude','إنترلُود','There is no night or day, only pauses between moments. Some pauses contain entire cities.','لا ليل ولا نهار، بل فواصل بين اللحظات. وبعض الفواصل تضم مدنًا كاملة.','Habitable pauses','فواصل قابلة للسكن','Blue mist','ضباب أزرق', 'A second folded in half','ثانية مطوية إلى نصفين',210,0],
['Aster','أستر','The stars above this world are drawn each morning by invisible migratory birds.','ترسم طيور مهاجرة غير مرئية نجوم هذا العالم كل صباح.','Drawn constellations','كوكبات مرسومة','Indigo hail','بَرَد نيلي','A feather of starlight','ريشة من ضوء النجوم',249,1],
['Exit','إكزِت','A world with a single door. It opens not to another place, but to a different possible version of the traveler.','عالم ذو باب واحد، لا يفتح على مكان آخر بل على نسخة ممكنة مختلفة من المسافر.','Alternative selves','ذوات بديلة','Crimson haze','ضباب قرمزي','A key without a lock','مفتاح بلا قفل',351,0]
];
const labels={en:{subtitle:'An expedition beyond reality',brand:'ELSEWHERE.',jump:'Jump to another world',postcard:'Save postcard',signalTitle:'An unknown signal',logTitle:'Expedition journal',export:'Export journal',foot:'A fictional universe. No accounts, no network requests, no real astronomical claims. Your discoveries stay in this browser.',law:'Impossible law',weather:'Atmosphere',orbit:'Orbit',sector:'SECTOR',catalog:'WORLD',band:'Band',hint:'Tune the receiver. Signal strength rises as you approach the hidden band. ',found:'Recovered: ',wrong:'Interference. Try a different band.',empty:'Nothing recovered yet. The universe is waiting.',count:' relics recovered',complete:'All relics recovered. The atlas is complete.',rings:'Ringed',plain:'Unringed'},ar:{subtitle:'رحلة إلى ما وراء الواقع',brand:'في مكان آخر.',jump:'اقفز إلى عالم آخر',postcard:'حفظ بطاقة الكوكب',signalTitle:'إشارة مجهولة',logTitle:'سجل الرحلة',export:'تصدير السجل',foot:'كون خيالي. لا حسابات ولا اتصالات شبكية ولا ادعاءات فلكية حقيقية. تبقى اكتشافاتك في هذا المتصفح.',law:'القانون المستحيل',weather:'الغلاف الجوي',orbit:'المدار',sector:'القطاع',catalog:'العالم',band:'التردد',hint:'اضبط جهاز الاستقبال. تزداد قوة الإشارة كلما اقتربت من التردد المخفي. ',found:'تم العثور على: ',wrong:'تشويش. جرّب ترددًا آخر.',empty:'لم تعثر على شيء بعد. الكون ينتظرك.',count:' آثار مستعادة',complete:'استعدت جميع الآثار. اكتمل الأطلس.',rings:'ذو حلقات',plain:'بلا حلقات'}};
let index=0, lang='en', collected=new Set(), attempts=new Set();
try{const saved=JSON.parse(localStorage.getItem('elsewhere-v1')||'{}');lang=saved.lang==='ar'?'ar':'en';index=Number.isInteger(saved.index)&&saved.index>=0&&saved.index<worlds.length?saved.index:0;collected=new Set((Array.isArray(saved.collected)?saved.collected:[]).filter(i=>Number.isInteger(i)&&i>=0&&i<worlds.length))}catch{}
function save(){try{localStorage.setItem('elsewhere-v1',JSON.stringify({lang,index,collected:[...collected]}))}catch{}}
function rng(seed){return()=>{seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296}}
function draw(){const w=worlds[index], hue=w[10], r=rng((index+1)*173293), W=C.width,H=C.height,x=W*.54,y=H*.51,R=144;
ctx.fillStyle='#070b16';ctx.fillRect(0,0,W,H);
const neb=ctx.createRadialGradient(x,y,5,x,y,350);neb.addColorStop(0,'hsla('+hue+',65%,28%,.6)');neb.addColorStop(1,'#070b16');ctx.fillStyle=neb;ctx.fillRect(0,0,W,H);
for(let i=0;i<210;i++){let a=r()*W,b=r()*H,s=r();ctx.fillStyle='rgba(224,241,255,'+(.15+r()*.7)+')';ctx.beginPath();ctx.arc(a,b,s>.97?1.9:.35+s*.65,0,Math.PI*2);ctx.fill()}
function rings(front){if(!w[11])return;ctx.save();ctx.translate(x,y);ctx.rotate(-.25);for(let j=0;j<17;j++){ctx.strokeStyle='hsla('+((hue+j*3)%360)+',55%,72%,'+(.12+(j%4)*.09)+')';ctx.lineWidth=1.6;ctx.beginPath();ctx.ellipse(0,0,R+24+j*3.8,38+j*2,0,front?0:Math.PI,front?Math.PI:Math.PI*2);ctx.stroke()}ctx.restore()}
rings(false);
const glow=ctx.createRadialGradient(x,y,R-2,x,y,R+22);glow.addColorStop(0,'hsla('+hue+',80%,60%,.6)');glow.addColorStop(1,'transparent');ctx.fillStyle=glow;ctx.beginPath();ctx.arc(x,y,R+22,0,Math.PI*2);ctx.fill();
ctx.save();ctx.beginPath();ctx.arc(x,y,R,0,Math.PI*2);ctx.clip();
const base=ctx.createLinearGradient(x-R,y-R,x+R,y+R);base.addColorStop(0,'hsl('+hue+',60%,75%)');base.addColorStop(.5,'hsl('+((hue+26)%360)+',55%,40%)');base.addColorStop(1,'hsl('+((hue+42)%360)+',55%,13%)');ctx.fillStyle=base;ctx.fillRect(x-R,y-R,2*R,2*R);
for(let i=0;i<65;i++){let yy=y-R+r()*2*R,amp=4+r()*25,phase=r()*6.28;ctx.beginPath();for(let xx=x-R;xx<=x+R;xx+=4){const v=yy+Math.sin(xx*.023+phase)*amp+Math.sin(xx*.055+phase)*4;if(xx===x-R)ctx.moveTo(xx,v);else ctx.lineTo(xx,v)}ctx.strokeStyle='hsla('+((hue+r()*60)%360)+',65%,'+(20+r()*60)+'%,'+(.08+r()*.2)+')';ctx.lineWidth=1+r()*14;ctx.stroke()}
for(let i=0;i<100;i++){const a=x-R+r()*R*2,b=y-R+r()*R*2;ctx.fillStyle='rgba(255,255,255,'+(r()*.12)+')';ctx.beginPath();ctx.ellipse(a,b,1+r()*4,1+r()*2,r()*3,0,6.28);ctx.fill()}
const shade=ctx.createLinearGradient(x-R,y-R,x+R,y+R);shade.addColorStop(0,'rgba(255,255,255,.18)');shade.addColorStop(.45,'transparent');shade.addColorStop(1,'rgba(0,0,15,.88)');ctx.fillStyle=shade;ctx.fillRect(x-R,y-R,2*R,2*R);ctx.restore();rings(true);
ctx.strokeStyle='rgba(210,235,255,.45)';ctx.lineWidth=1;ctx.beginPath();ctx.arc(x,y,R+7,0.1,1.4);ctx.stroke();ctx.beginPath();ctx.arc(x,y,R+7,3.2,4.1);ctx.stroke();
ctx.font='11px monospace';ctx.fillStyle='#a0aec5';ctx.textAlign='left';ctx.fillText('ELSEWHERE / '+String(index+1).padStart(2,'0'),20,H-22);ctx.textAlign='right';ctx.fillText('FICTIONAL ATLAS',W-20,H-22);
}
function target(){return (index*7+3)%5}
function render(){const t=labels[lang], ar=lang==='ar',w=worlds[index];document.documentElement.lang=lang;document.documentElement.dir=ar?'rtl':'ltr';$('lang').textContent=ar?'English':'العربية';for(const key of ['subtitle','brand','jump','postcard','signalTitle','logTitle','export','foot'])$(key).textContent=t[key];$('sector').textContent=t.sector+' '+String(index+1).padStart(2,'0');$('coordinates').textContent='X '+(index*137+41)+' / Y '+(index*83+17);$('catalog').textContent=t.catalog+' '+(index+1)+' / '+worlds.length;$('world').textContent=w[ar?1:0];$('story').textContent=w[ar?3:2];$('stats').replaceChildren();for(const [name,val] of [[t.law,w[ar?5:4]],[t.weather,w[ar?7:6]],[t.orbit,w[11]?t.rings:t.plain]]){const d=document.createElement('div');d.className='stat';const a=document.createElement('span'),b=document.createElement('span');a.textContent=name;b.textContent=val;d.append(a,b);$('stats').append(d)}
$('hint').textContent=t.hint;$('bands').replaceChildren();for(let i=0;i<5;i++){const b=document.createElement('button');b.textContent=String(i+1);b.setAttribute('aria-label',t.band+' '+(i+1));b.disabled=collected.has(index)||attempts.has(i);b.onclick=()=>{attempts.add(i);if(i===target()){collected.add(index);save()}render()};$('bands').append(b)}const pct=collected.has(index)?100:attempts.size?Math.max(...[...attempts].map(i=>100-20*Math.abs(i-target()))):0;$('strength').style.width=pct+'%';$('meter').setAttribute('aria-valuenow',pct);$('result').textContent=collected.has(index)?t.found+w[ar?9:8]:attempts.size?t.wrong:'';$('count').textContent=collected.size===worlds.length?t.complete:collected.size+'/'+worlds.length+t.count;$('entries').replaceChildren();if(!collected.size){const p=document.createElement('p');p.className='muted';p.textContent=t.empty;$('entries').append(p)}for(const i of [...collected].sort((a,b)=>a-b)){const e=document.createElement('div');e.className='entry';const s=document.createElement('strong'),p=document.createElement('small');s.textContent=worlds[i][ar?9:8];p.textContent=worlds[i][ar?1:0];e.append(s,p);$('entries').append(e)}draw();save()}
function go(i){index=(i+worlds.length)%worlds.length;attempts.clear();render()}
$('prev').onclick=()=>go(index-1);$('next').onclick=()=>go(index+1);$('jump').onclick=()=>{const un=worlds.map((_,i)=>i).filter(i=>i!==index&&!collected.has(i));const candidates=un.length?un:worlds.map((_,i)=>i).filter(i=>i!==index);go(candidates[Math.floor(Math.random()*candidates.length)])};$('lang').onclick=()=>{lang=lang==='en'?'ar':'en';render()};
function download(url,name){const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove()}
$('postcard').onclick=()=>download(C.toDataURL('image/png'),'elsewhere-'+(index+1)+'.png');$('export').onclick=()=>{const data={atlas:'Elsewhere',fictional:true,discovered:[...collected].sort((a,b)=>a-b).map(i=>({world:worlds[i][0],world_ar:worlds[i][1],relic:worlds[i][8],relic_ar:worlds[i][9]}))};const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));download(url,'elsewhere-journal.json');setTimeout(()=>URL.revokeObjectURL(url),1000)};
render();
</script></body></html>
